[project]
name = "portfoliopulse"
version = "0.1.0"
description = "Evidence-first research workbench for analysing public information about PE-backed companies."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "google-genai>=2.31.0",
    "openpyxl>=3.1.5",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfoliopulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
